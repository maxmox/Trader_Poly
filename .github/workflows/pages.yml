name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # reserva: na prática o GitHub atrasa horas; o Worker dispara a cada 10 min (GH_TOKEN)
  workflow_dispatch:

permissions:
  contents: write   # commit de data/apostas_edgely (acompanhamento das apostas do Edgely)
  pages: write
  id-token: write

# não cancela a execução em andamento (com disparo a cada 10 min, uma execução lenta nunca terminaria);
# o GitHub guarda só a mais nova na fila
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar posições abertas
        run: node scripts/snapshot.mjs
      # sem continue-on-error: se o histórico publicado não puder ser lido, a rodada para aqui e NÃO publica (senão o
      # site receberia um histórico vazio; aconteceu em 23/10/2026). A próxima rodada, 10 min depois, segue normal.
      - name: Linhas da NBA na DraftKings (histórico da página props.html)
        run: node scripts/linhas_dk.mjs
      - name: Projeções do Edgely (aba Edge; consulta 1x por dia ou quando pedida na página)
        run: node scripts/edgely.mjs
        continue-on-error: true
      - name: Apostas do Edgely (registro às 12 h de Brasília e resultados)
        run: node scripts/apostas_edgely.mjs
        continue-on-error: true
      # o acompanhamento é histórico permanente: fica no repositório (commits do GITHUB_TOKEN não disparam a Action)
      - name: Guardar as apostas no repositório
        run: |
          git add data/apostas_edgely
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "Apostas do Edgely: registro/resultados"
            git pull --rebase --autostash && git push
          fi
        continue-on-error: true
      - name: Desempenho dos últimos 30 dias (placar)
        run: node scripts/desempenho.mjs
        continue-on-error: true
      # o GitHub Pages manda o navegador guardar cada arquivo por 10 min; os módulos JS se importam em cadeia e o
      # navegador misturava arquivo novo com velho (página quebrada ou antiga). Cada publicação marca os .js com o
      # commit (?v=), só no que vai para o site (os scripts da Action já rodaram acima)
      - name: Marcar os arquivos JS com a versão (cache do navegador)
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/[a-z0-9_]+\.js)\"#\1?v=$v\"#g" *.html
          sed -i -E "s#(from \"\./[a-z0-9_]+\.js)\"#\1?v=$v\"#g; s#(import\(\"\./[a-z0-9_]+\.js)\"#\1?v=$v\"#g" js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # o GitHub pode atrasar (ou pular) em horário de pico
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar posições abertas
        run: node scripts/snapshot.mjs
      - name: Desempenho dos últimos 30 dias (placar)
        run: node scripts/desempenho.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
